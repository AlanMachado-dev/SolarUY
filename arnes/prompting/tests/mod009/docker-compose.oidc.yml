name: solaruy-mod009-aceptacion

x-app: &app
  image: solaruy:mod009-aceptacion
  build:
    context: ../../../..
    dockerfile: Dockerfile
  labels: {solaruy.prueba: mod009}
  environment: &entorno
    ASPNETCORE_ENVIRONMENT: Production
    ASPNETCORE_HTTP_PORTS: "8080"
    Balanceo__Habilitado: "true"
    Balanceo__ProxyConfiable: 172.30.90.10
    Balanceo__AutoridadPublica: localhost:9449
    Balanceo__DirectorioClaves: /app/claves
    Balanceo__CertificadoClaves: /run/private/claves.pfx
    Balanceo__PasswordCertificadoFile: /run/private/claves-password.txt
    AsistenteArchivoPrivado: /run/private/asistente.private.json
    Asistente__Habilitado: "true"
  volumes:
    - type: bind
      source: ${SOLARUY_MOD009_RAIZ}/.solaruy-acceptance/mod009/appsettings.Local.json
      target: /app/appsettings.Local.json
      read_only: true
      bind: {create_host_path: false}
    - type: bind
      source: ${SOLARUY_MOD009_RAIZ}/.solaruy-private
      target: /run/private
      read_only: true
      bind: {create_host_path: false}
    - claves:/app/claves
  networks: [aceptacion]
  depends_on:
    mysql-pruebas: {condition: service_healthy}
  healthcheck:
    test: [CMD, curl, --fail, --silent, --max-time, "4", "http://localhost:8080/health/ready"]
    interval: 5s
    timeout: 5s
    retries: 12
    start_period: 20s

services:
  app1:
    <<: *app
    environment:
      <<: *entorno
      Balanceo__Instancia: app1
      TZ: UTC
    ports: ["127.0.0.1:14329:8080"]
  app2:
    <<: *app
    environment:
      <<: *entorno
      Balanceo__Instancia: app2
      TZ: Asia/Tokyo
    ports: ["127.0.0.1:14330:8080"]
  nginx:
    image: nginx:1.28.0-alpine
    labels: {solaruy.prueba: mod009}
    ports: ["127.0.0.1:9449:443"]
    volumes:
      - type: bind
        source: ${SOLARUY_MOD009_RAIZ}/.solaruy-acceptance/mod009/nginx.conf
        target: /etc/nginx/nginx.conf
        read_only: true
        bind: {create_host_path: false}
      - type: bind
        source: ${SOLARUY_MOD009_RAIZ}/.solaruy-private
        target: /run/private
        read_only: true
        bind: {create_host_path: false}
    depends_on:
      app1: {condition: service_healthy}
      app2: {condition: service_healthy}
    networks:
      aceptacion: {ipv4_address: 172.30.90.10}
  mysql-pruebas:
    image: mysql:8.4
    labels: {solaruy.prueba: mod009}
    environment:
      MYSQL_DATABASE: solaruy_mod009
      MYSQL_USER: solaruy
      MYSQL_PASSWORD_FILE: /run/prueba/mysql-password.txt
      MYSQL_ROOT_PASSWORD_FILE: /run/prueba/mysql-root-password.txt
    ports: ["127.0.0.1:43329:3306"]
    volumes:
      - datos:/var/lib/mysql
      - type: bind
        source: ${SOLARUY_MOD009_RAIZ}/.solaruy-acceptance/mod009
        target: /run/prueba
        read_only: true
        bind: {create_host_path: false}
    networks: [aceptacion]
    healthcheck:
      test: [CMD, mysqladmin, ping, --silent, --host=localhost]
      interval: 5s
      timeout: 3s
      retries: 30

networks:
  aceptacion:
    ipam:
      config: [{subnet: 172.30.90.0/24}]
volumes:
  datos:
  claves:
