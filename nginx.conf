worker_processes auto;
# Los errores de upstream pueden contener la URL completa del callback OIDC.
error_log /var/log/nginx/error.log crit;
pid /var/run/nginx.pid;
events { worker_connections 1024; }

http {
    server_tokens off;
    log_format depurado '$time_iso8601 status=$status instancia=$upstream_addr';
    access_log /var/log/nginx/access.log depurado;
    # OIDC puede emitir una cookie autenticada dividida en varios fragmentos.
    large_client_header_buffers 4 32k;

    map $http_upgrade $conexion_upgrade {
        default upgrade;
        '' close;
    }
    map $cookie_SolarUY_Afinidad $clave_afinidad {
        '' $request_id;
        default $cookie_SolarUY_Afinidad;
    }
    map $cookie_SolarUY_Afinidad $emitir_afinidad {
        '' "SolarUY_Afinidad=$clave_afinidad; Path=/; HttpOnly; Secure; SameSite=Lax";
        default '';
    }
    resolver 127.0.0.11 valid=2s ipv6=off;
    upstream backend {
        zone backend 64k;
        hash $clave_afinidad consistent;
        server app1:8080 resolve max_fails=1 fail_timeout=2s;
        server app2:8080 resolve max_fails=1 fail_timeout=2s;
    }

    server {
        listen 443 ssl default_server;
        server_name localhost;
        ssl_certificate /run/private/localhost.crt;
        ssl_certificate_key /run/private/localhost.key;
        ssl_protocols TLSv1.2 TLSv1.3;

        add_header Set-Cookie $emitir_afinidad always;
        location ~* ^/health/ready(?:/|$) { return 404; }
        location / {
            proxy_pass http://backend;
            proxy_http_version 1.1;
            proxy_set_header Host $http_host;
            proxy_set_header X-Forwarded-Host $http_host;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_set_header X-Forwarded-Prefix '';
            proxy_set_header Forwarded '';
            proxy_set_header X-SolarUY-Instancia '';
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $conexion_upgrade;
            proxy_buffering off;
            proxy_buffer_size 32k;
            proxy_buffers 4 32k;
            proxy_connect_timeout 1s;
            proxy_read_timeout 3600s;
            proxy_send_timeout 3600s;
            proxy_next_upstream error timeout http_502 http_503 http_504;
            proxy_next_upstream_tries 2;
            proxy_next_upstream_timeout 3s;
        }
    }
}
